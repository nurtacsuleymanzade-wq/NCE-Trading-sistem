function showPrice(d){if(!d.length)return;var lc=d[d.length-1].c,pc=d.length>1?d[d.length-2].c:lc,ch=(lc-pc)/pc*100;document.getElementById('pr').textContent='$'+lc.toLocaleString();document.getElementById('cg').textContent=(ch>0?'+':'')+ch.toFixed(2)+'%';document.getElementById('cg').className=ch>=0?'gn':'rd';}
function showStats(tf,d){if(!d.length)return;var start=Math.max(0,d.length-20),hi=-Infinity,lo=Infinity;for(var i=start;i<d.length;i++){var x=d[i];hi=Math.max(hi,x.h);lo=Math.min(lo,x.l);}document.getElementById('n24').innerHTML='<b>$'+hi.toLocaleString()+'</b>';document.getElementById('x24').innerHTML='<b>$'+lo.toLocaleString()+'</b>';document.getElementById('oi').innerHTML='<b>'+MARKET+'</b>';document.getElementById('fd').innerHTML='<b>'+VOLUME_UNIT+'</b>';document.getElementById('ls').innerHTML='<b>Wilder RMA14</b>';setWsLabel();}
function onCrosshair(p){if(!p.time||!p.point||!curData.length){tip.style.display='none';return;}var d=p.seriesData.get(cs);if(!d){tip.style.display='none';return;}var m=curData.find(function(x){return x.t===d.time;})||{},dt=new Date(d.time*1000),state=m.closed?'CLOSED':'PROVISIONAL';var ev=m.closed?(m.naiLabel||'-'):('PROVISIONAL: '+((m.naiProvisionalEvents||[]).join(', ')||'-'));var h='<b style="color:#e94560;font-size:9px">'+dt.toISOString().slice(0,16).replace('T',' ')+' UTC</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:1px 5px;font-size:8px">';h+='Market:<span>'+MARKET+'</span>Unit:<span>'+VOLUME_UNIT+'</span>State:<span class="'+(m.closed?'':'prov')+'">'+state+'</span>TF EMA5:<span>'+tfText(curTF)+'</span>';h+='O:<span>$'+d.open.toFixed(1)+'</span>H:<span style="color:#3fb950">$'+d.high.toFixed(1)+'</span>L:<span style="color:#f85149">$'+d.low.toFixed(1)+'</span>C:<span>$'+d.close.toFixed(1)+'</span>';h+='BuyLine:<span style="color:#3fb950">'+((m.naiBuy||0).toFixed(2))+'</span>SellLine:<span style="color:#f85149">'+((m.naiSell||0).toFixed(2))+'</span>';h+='ND:<span>'+((m.naiND||0).toFixed(4))+'</span>VolPower:<span>'+((m.naiVP||0).toFixed(3))+'</span>ATR14:<span>'+((m.naiATR14||0).toFixed(3))+'</span>PriceResp:<span>'+((m.naiPriceResponse||0).toFixed(3))+'</span>';h+='Events:<span style="color:#f2cc60">'+ev+'</span></div>';tip.innerHTML=h;tip.style.cssText='display:block;position:absolute;left:'+Math.max(5,Math.min(p.point.x,window.innerWidth-250))+'px;top:'+Math.max(5,p.point.y-10)+'px';}
function resizeC(){var vh=pan.vol?0.22:0,dh=pan.del?0.12:0,nh=pan.nai?0.14:0,used=vh+dh+nh;chart.priceScale('right').applyOptions({scaleMargins:{top:0,bottom:used}});chart.priceScale('vol').applyOptions({scaleMargins:{top:1-used,bottom:dh+nh}});chart.priceScale('del').applyOptions({scaleMargins:{top:1-dh-nh,bottom:nh}});chart.priceScale('nai').applyOptions({scaleMargins:{top:1-nh,bottom:0.01},visible:pan.nai});}
function refreshPanels(){resizeC();if(curData.length)setSeries(curData,curTF);}function closePanel(p){pan[p]=false;document.getElementById(p==='vol'?'vl':(p==='del'?'dl':'nl')).style.display='none';updBar();refreshPanels();}function updBar(){var bar=document.getElementById('panel-bar');bar.innerHTML='';['vol','del','nai'].forEach(function(p){if(!pan[p]){var b=document.createElement('button');b.textContent='+ '+p.toUpperCase();b.onclick=function(){pan[p]=true;document.getElementById(p==='vol'?'vl':(p==='del'?'dl':'nl')).style.display='flex';updBar();refreshPanels();};bar.appendChild(b);}});}
var tb=document.getElementById('tf');TFs.forEach(function(t){var b=document.createElement('button');b.textContent=t;b.onclick=function(){tb.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');loadTF(t);};if(t==='1D')b.classList.add('on');tb.appendChild(b);});
if(ENABLE_LIVE){try{wsPrice=new WebSocket(WS_PRICE);wsPrice.onmessage=function(e){try{if(curTF==='1s')return;document.getElementById('pr').textContent='$'+(+JSON.parse(e.data).p).toLocaleString();}catch(e2){}};}catch(e){}}
window.onresize=function(){chart.applyOptions({width:window.innerWidth,height:window.innerHeight-54});};updBar();init();setWsLabel();loadTF('1D');setInterval(function(){if(curTF!=='1s')showStats(curTF,curData);},60000);
</script></body></html>
