<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BTC OF</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:system-ui;overflow:hidden}
#hd{background:#161b22;padding:2px 8px;display:flex;align-items:center;gap:6px;border-bottom:1px solid #30363d;flex-wrap:wrap}
#hd h1{color:#e94560;font-size:11px;margin:0}#pr{font-size:15px;font-weight:700}
.gn{color:#3fb950}.rd{color:#f85149}
#tf{display:flex;gap:1px;margin-left:auto;overflow-x:auto;max-width:60%;-webkit-overflow-scrolling:touch}
#tf button{background:#21262d;border:1px solid #30363d;color:#8b949e;padding:1px 5px;border-radius:2px;cursor:pointer;font-size:8px;white-space:nowrap;flex-shrink:0}
#tf button.on{background:#1f6feb;border-color:#1f6feb;color:#fff}
#info{display:flex;gap:3px;font-size:7px;color:#8b949e;padding:1px 8px;background:#161b22;border-bottom:1px solid #30363d;flex-wrap:wrap;overflow-x:auto;white-space:nowrap}
#info span b{color:#c9d1d9}
#ct{position:relative;width:100%;height:calc(100vh - 54px)}
.marker{position:absolute;z-index:6;font-size:8px;padding:1px 4px;border-radius:4px;background:rgba(22,27,34,.9);border:1px solid #30363d;pointer-events:none}
#tip{display:none;position:absolute;background:rgba(22,27,34,0.95);border:1px solid #30363d;border-radius:6px;padding:6px 8px;font-size:9px;z-index:10;pointer-events:none;min-width:120px}
#panel-bar{display:flex;gap:3px;padding:2px 8px;background:#161b22;border-bottom:1px solid #30363d;overflow-x:auto}
#panel-bar button{background:#21262d;border:1px solid #30363d;color:#8b949e;padding:1px 6px;border-radius:3px;cursor:pointer;font-size:8px;white-space:nowrap}
</style>
</head>
<body>
<div id="hd">
  <h1>🐉 BF</h1>
  <span id="pr">--</span><span id="cg"></span>
  <div id="tf"></div>
</div>
<div id="info">
  <span>H24: <b id="n24">--</b></span>
  <span>L24: <b id="x24">--</b></span>
  <span>OI:<b id="oi">--</b></span>
  <span>FD:<b id="fd">--</b></span>
  <span>L/S:<b id="ls">--</b></span>
  <span>MP:<b id="mp">--</b></span>
</div>
<div id="panel-bar"></div>
<div id="ct">
  <div id="tip"></div>
  <div id="vl" style="position:absolute;bottom:30%;left:4px;background:#161b22;border:1px solid #30363d;border-radius:4px;padding:1px 6px;font-size:8px;color:#26a69a;display:flex;align-items:center;gap:6px;z-index:5">📊 Vol <span style="color:#f85149;cursor:pointer;font-size:10px;padding:0 3px" onclick="closePanel('vol')">✕</span></div>
  <div id="dl" style="position:absolute;bottom:18%;left:4px;background:#161b22;border:1px solid #30363d;border-radius:4px;padding:1px 6px;font-size:8px;color:#ef5350;display:flex;align-items:center;gap:6px;z-index:5">📉 Del <span style="color:#f85149;cursor:pointer;font-size:10px;padding:0 3px" onclick="closePanel('del')">✕</span></div>
  <div id="nl" style="position:absolute;bottom:4%;left:4px;background:#161b22;border:1px solid #30363d;border-radius:4px;padding:1px 6px;font-size:8px;color:#f2cc60;display:flex;align-items:center;gap:6px;z-index:5">⚔ NAIİk <span style="color:#3fb950">Buy</span>/<span style="color:#f85149">Sell</span> <span style="color:#f85149;cursor:pointer;font-size:10px;padding:0 3px" onclick="closePanel('nai')">✕</span></div>
</div>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
// === CONFIG ===
var TFs = ['1s','1m','5m','15m','30m','1h','4h','1D','3D'];
var BIN = 'https://api.binance.com';
var SRV = 'https://surveillance-damages-gym-harper.trycloudflare.com/chart';
var ENABLE_LIVE = new URLSearchParams(location.search).get('live') === '1';

var curTF = '1D', curData = [], chart, cs, vs, ds, bs, ss, tip = document.getElementById('tip');
var pan = {vol:true, del:true, nai:true};
var ws1s = null;
var oneSecondBars = {};

// === TIMEFRAME BUTTONS ===
var tb = document.getElementById('tf');
TFs.forEach(function(t){
  var b = document.createElement('button');
  b.textContent = t;
  b.onclick = function(){
    tb.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); curTF = t; loadTF(t);
  };
  if(t === '1D') b.classList.add('on');
  tb.appendChild(b);
});

// === CHART INIT ===
function init(){
  chart = LightweightCharts.createChart(document.getElementById('ct'),{
    layout:{textColor:'#8b949e',background:{color:'#0d1117'}},
    grid:{vertLines:{color:'#161b22'},horzLines:{color:'#161b22'}},
    timeScale:{borderColor:'#30363d',timeVisible:true,secondsVisible:true},
    rightPriceScale:{borderColor:'#30363d'},
  });

  cs = chart.addCandlestickSeries({upColor:'#3fb950',downColor:'#f85149',borderVisible:false,wickUpColor:'#3fb950',wickDownColor:'#f85149',priceScaleId:'right'});
  chart.priceScale('right').applyOptions({scaleMargins:{top:0,bottom:0.3}});
  
  vs = chart.addHistogramSeries({color:'#26a69a',priceFormat:{type:'volume'},priceScaleId:'vol'});
  chart.priceScale('vol').applyOptions({scaleMargins:{top:0.7,bottom:0.15}});
  
  ds = chart.addHistogramSeries({color:'#ef5350',priceFormat:{type:'volume'},priceScaleId:'del'});
  chart.priceScale('del').applyOptions({scaleMargins:{top:0.77,bottom:0.11}});

  bs = chart.addLineSeries({color:'#3fb950',lineWidth:2,priceScaleId:'nai',priceLineVisible:false,lastValueVisible:false});
  ss = chart.addLineSeries({color:'#f85149',lineWidth:2,priceScaleId:'nai',priceLineVisible:false,lastValueVisible:false});
  chart.priceScale('nai').applyOptions({scaleMargins:{top:0.90,bottom:0.01},visible:false});

  chart.subscribeCrosshairMove(function(p){
    if(!p.time||!p.point||!curData.length){tip.style.display='none';return;}
    var d=p.seriesData.get(cs); if(!d){tip.style.display='none';return;}
    var dt=new Date(d.time*1000);
    var ds2=('0'+dt.getUTCDate()).slice(-2)+'/'+('0'+(dt.getUTCMonth()+1)).slice(-2)+'/'+dt.getUTCFullYear();
    var ts=('0'+dt.getUTCHours()).slice(-2)+':'+('0'+dt.getUTCMinutes()).slice(-2);
    var m=curData.find(function(x){return x.t===d.time;})||{};
    var v=m.v||0, bv=m.bv||0, sv=m.sv||(v-bv), del=m.del||(bv*2-v), agr=v?Math.round(del/v*100):0;
    var h='<b style="color:#e94560;font-size:9px">'+ds2+' '+ts+'</b>';
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:1px 4px;font-size:8px">';
    h+='O:<span>$'+d.open.toFixed(1)+'</span>H:<span style="color:#3fb950">$'+d.high.toFixed(1)+'</span>';
    h+='L:<span style="color:#f85149">$'+d.low.toFixed(1)+'</span>C:<span>$'+d.close.toFixed(1)+'</span>';
    h+='Vol:<span>'+v.toFixed(1)+'</span>Buy:<span style="color:#3fb950">'+bv.toFixed(1)+'</span>';
    h+='Sell:<span style="color:#f85149">'+sv.toFixed(1)+'</span>Delta:<span style="color:'+(del>=0?'#3fb950':'#f85149')+'">'+(del>=0?'+':'')+del.toFixed(1)+'</span>';
    h+='Agr:<span style="color:'+(agr>=0?'#3fb950':'#f85149')+'">'+(agr>=0?'+':'')+agr+'%</span>';
    if(typeof m.naiBuy==='number') h+='NAIİk:<span><b style="color:#3fb950">'+m.naiBuy.toFixed(0)+'</b>/<b style="color:#f85149">'+m.naiSell.toFixed(0)+'</b></span>';
    if(m.naiLabel) h+='Evt:<span style="color:#f2cc60">'+m.naiLabel+'</span>';
    h+='</div>';
    tip.innerHTML=h;
    tip.style.cssText='display:block;position:absolute;left:'+Math.max(5,Math.min(p.point.x,window.innerWidth-150))+'px;top:'+Math.max(5,p.point.y-10)+'px';
  });
}

function refreshPanels(){ resizeC(); if(curData.length) setSeries(curData, curTF); }
function closePanel(p){ pan[p]=false; document.getElementById(p==='vol'?'vl':(p==='del'?'dl':'nl')).style.display='none'; updBar(); refreshPanels(); }
function updBar(){
  var bar=document.getElementById('panel-bar'); bar.innerHTML='';
  if(!pan.vol){var b=document.createElement('button');b.textContent='+ Vol';b.onclick=function(){pan.vol=true;document.getElementById('vl').style.display='flex';updBar();refreshPanels();};bar.appendChild(b);}
  if(!pan.del){var b=document.createElement('button');b.textContent='+ Del';b.onclick=function(){pan.del=true;document.getElementById('dl').style.display='flex';updBar();refreshPanels();};bar.appendChild(b);}
  if(!pan.nai){var b=document.createElement('button');b.textContent='+ NAIİk';b.onclick=function(){pan.nai=true;document.getElementById('nl').style.display='flex';updBar();refreshPanels();};bar.appendChild(b);}
}
function resizeC(){
  var vh=pan.vol?0.22:0, dh=pan.del?0.12:0, nh=pan.nai?0.12:0, used=vh+dh+nh;
  chart.priceScale('right').applyOptions({scaleMargins:{top:0,bottom:used}});
  chart.priceScale('vol').applyOptions({scaleMargins:{top:1-used,bottom:dh+nh}});
  chart.priceScale('del').applyOptions({scaleMargins:{top:1-dh-nh,bottom:nh}});
  chart.priceScale('nai').applyOptions({scaleMargins:{top:1-nh,bottom:0.01},visible:false});
}

// === DATA LOADING ===
function klineToBar(c){
  var o=+c[1], h=+c[2], l=+c[3], cl=+c[4], v=+c[5], bv=+c[9];
  return {t:Math.floor(c[0]/1000),o:o,h:h,l:l,c:cl,v:v,bv:bv};
}
function visibleBars(tf){
  return {'1s':120,'1m':180,'5m':180,'15m':160,'30m':140,'1h':120,'4h':100,'1D':120,'3D':90}[tf] || 120;
}
function applyViewport(tf, len){
  if(!len) return;
  var bars = Math.min(visibleBars(tf), len);
  chart.timeScale().setVisibleLogicalRange({from:Math.max(0, len-bars)-1, to:len+5});
}
function ema(prev, val, len){ var a=2/(len+1); return prev==null?val:(prev+a*(val-prev)); }
function calcNAI(list){
  var ev=null, ea=null, eaReg=null, eb=null, es=null, out=[];
  for(var i=0;i<list.length;i++){
    var x=list[i], v=Math.max(0,x.v||0), bv=Math.max(0,x.bv||0), sv=Math.max(0,(x.sv!=null?x.sv:(v-bv)));
    if(!v && (bv||sv)) v=bv+sv;
    var tr=Math.max((x.h||0)-(x.l||0), Math.abs((x.h||0)-(i?list[i-1].c:x.o||x.c||0)), Math.abs((x.l||0)-(i?list[i-1].c:x.o||x.c||0)));
    ea=ema(ea,tr,14); eaReg=ema(eaReg,ea||tr||1,300); ev=ema(ev,v,300);
    var nd=(bv-sv)/(v+1e-9), vp=Math.max(0,Math.min(5,v/((ev||v)||1))), atrReg=Math.max(0.5,Math.min(3,(ea||tr||1)/((eaReg||ea||tr)||1)));
    var rel=vp/Math.sqrt(atrReg), buyShare=bv/(v+1e-9), sellShare=sv/(v+1e-9);
    var rawBuy=buyShare*(1+Math.max(nd,0))*rel, rawSell=sellShare*(1+Math.max(-nd,0))*rel;
    var buyAgg=100*(1-Math.exp(-rawBuy)), sellAgg=100*(1-Math.exp(-rawSell));
    eb=ema(eb,buyAgg,5); es=ema(es,sellAgg,5);
    var atr=ea||tr||1, pr=((x.c||0)-(x.o||0))/(atr+1e-9), sr=((x.o||0)-(x.c||0))/(atr+1e-9), label='';
    if(eb>=70 && eb>es && nd>=0.25 && vp>=1.5 && pr<=0.10) label=pr<0?'STRONG BUY ABSORPTION':'BUY ABSORPTION';
    else if(es>=70 && es>eb && nd<=-0.25 && vp>=1.5 && sr<=0.10) label=sr<0?'STRONG SELL ABSORPTION':'SELL ABSORPTION';
    else if(eb>=70 && pr>=0.25) label='INITIATIVE BUY';
    else if(es>=70 && sr>=0.25) label='INITIATIVE SELL';
    else if(i>0 && Math.max(out[i-1].naiBuy,out[i-1].naiSell)>=85 && Math.max(eb,es)<55 && vp<1.2) label='EXHAUSTION';
    x.naiBuy=eb; x.naiSell=es; x.naiND=nd; x.naiVP=vp; x.naiLabel=label; out.push(x);
  }
  return out;
}
function naiMarkers(list){
  var mk=[];
  list.forEach(function(x){
    if(!x.naiLabel) return;
    var isBuy=x.naiLabel.indexOf('BUY')>=0, isSell=x.naiLabel.indexOf('SELL')>=0;
    mk.push({time:x.t,position:isSell?'aboveBar':'belowBar',color:x.naiLabel==='EXHAUSTION'?'#f2cc60':(isBuy?'#3fb950':'#58a6ff'),shape:x.naiLabel==='EXHAUSTION'?'circle':(isSell?'arrowDown':'arrowUp'),text:x.naiLabel});
  });
  return mk.slice(-80);
}
function setSeries(list, tf){
  list = calcNAI(list);
  cs.setData(list.map(function(x){return{time:x.t,open:x.o,high:x.h,low:x.l,close:x.c};}));
  cs.setMarkers(naiMarkers(list));
  vs.setData(list.map(function(x){return{time:x.t,value:x.v||0,color:'rgba(38,166,154,0.3)'};}));
  ds.setData(list.map(function(x){var d=(x.bv||0)*2-(x.v||0);return{time:x.t,value:Math.abs(d),color:d>=0?'rgba(38,166,154,0.3)':'rgba(239,83,80,0.3)'};}));
  bs.setData(pan.nai?list.map(function(x){return{time:x.t,value:x.naiBuy||0};}):[]);
  ss.setData(pan.nai?list.map(function(x){return{time:x.t,value:x.naiSell||0};}):[]);
  resizeC(); applyViewport(tf || curTF, list.length);
}
function renderData(data){
  curData = data.filter(function(x){ return x && x.t && x.o && x.h && x.l && x.c; });
  setSeries(curData, curTF);
  window.__nceDebug = {tf:curTF, bars:curData.length, nai:curData.slice(-1)[0]&&{buy:curData.slice(-1)[0].naiBuy,sell:curData.slice(-1)[0].naiSell,label:curData.slice(-1)[0].naiLabel}, first:curData[0]&&curData[0].t, last:curData[curData.length-1]&&curData[curData.length-1].t, visible:chart.timeScale().getVisibleLogicalRange()};
}
function agg3d(days){
  var out=[];
  for(var i=0;i<days.length;i+=3){
    var g=days.slice(i,i+3); if(!g.length) continue;
    var v=0,bv=0,hi=-Infinity,lo=Infinity;
    g.forEach(function(x){ v+=x.v||0; bv+=x.bv||0; if(x.h>hi)hi=x.h; if(x.l<lo)lo=x.l; });
    out.push({t:g[0].t,o:g[0].o,h:hi,l:lo,c:g[g.length-1].c,v:v,bv:bv});
  }
  return out;
}
function loadFromBinance(tf){
  var intv = {'1m':'1m','5m':'5m','15m':'15m','30m':'30m','1h':'1h','4h':'4h','1D':'1d','3D':'1d'}[tf] || '1d';
  var lim = {'1m':1000,'5m':1000,'15m':1000,'30m':1000,'1h':1000,'4h':1000,'1D':365,'3D':365}[tf] || 365;
  return fetch(BIN+'/api/v3/klines?symbol=BTCUSDT&interval='+intv+'&limit='+lim)
    .then(function(r){ if(!r.ok) throw Error('Binance HTTP '+r.status); return r.json(); })
    .then(function(k){
      var data = k.map(klineToBar);
      if(tf==='3D') data = agg3d(data);
      renderData(data); showPrice(curData); showStats(tf, curData);
    });
}
function localFile(tf){
  return {'1s':'bars_1s.json','1m':'bars_1m.json','5m':'bars_5m.json','15m':'bars_15m.json','30m':'bars_30m.json','1h':'bars_1h.json','4h':'bars_4h.json','1D':'bars_1d.json','3D':'bars_3d.json'}[tf];
}
function loadLocalBars(tf){
  var fn = localFile(tf);
  if(!fn) throw Error('no local file for '+tf);
  return fetch('data/'+fn)
    .then(function(r){ if(!r.ok) throw Error('Local HTTP '+r.status); return r.json(); })
    .then(function(k){
      var data = k.map(function(x){return{t:x.t||x.time,o:x.o||x.open,h:x.h||x.high,l:x.l||x.low,c:x.c||x.close,v:x.v||x.volume||0,bv:(x.bv!=null?x.bv:((x.v||x.volume||0)/2)),sv:(x.sv!=null?x.sv:undefined)};});
      renderData(data); showPrice(curData); showStats(tf, curData);
    });
}
function loadTF(tf){
  if(tf==='1s'){ load1s(); return; }
  if(ws1s){ws1s.onclose=null;ws1s.close();ws1s=null;}
  // GitHub Pages local JSON is the primary source so user devices are not blocked by Binance fetch/CORS/network differences.
  loadLocalBars(tf).catch(function(localErr){
    loadFromBinance(tf).catch(function(binErr){ document.getElementById('pr').textContent='Err: '+localErr.message; });
  });
}

function showPrice(d){
  if(!d.length) return;
  var lc = d[d.length-1].c, pc = d.length>1 ? d[d.length-2].c : lc;
  var ch = (lc-pc)/pc*100;
  document.getElementById('pr').textContent = '$'+lc.toLocaleString();
  document.getElementById('cg').textContent = (ch>0?'+':'')+ch.toFixed(2)+'%';
  document.getElementById('cg').className = ch>=0?'gn':'rd';
}

function showStats(tf, d){
  if(!d.length) return;
  var start = Math.max(0,d.length-20);
  var hi=-Infinity, lo=Infinity, vol=0, bv=0;
  for(var i=start;i<d.length;i++){
    var x=d[i]; if(x.h>hi)hi=x.h; if(x.l<lo)lo=x.l; vol+=x.v||0; bv+=x.bv||0;
  }
  document.getElementById('n24').innerHTML='<b>$'+hi.toLocaleString()+'</b>';
  document.getElementById('x24').innerHTML='<b>$'+lo.toLocaleString()+'</b>';
  document.getElementById('oi').innerHTML='<b>spot</b>';
  document.getElementById('fd').innerHTML='<b>n/a</b>';
  document.getElementById('ls').innerHTML='<b>n/a</b>';
  var mp=d.slice(-10).reduce(function(s,x){return s+x.c;},0)/Math.min(10,d.length);
  document.getElementById('mp').innerHTML='<b>$'+mp.toFixed(0)+'</b>';
}

// === 1-SECOND BARS ===
function load1s(){
  curData=[]; oneSecondBars={};
  renderData([]);
  // Seed from GitHub Pages local JSON first; Binance/WebSocket is only an opt-in live enhancement (?live=1).
  loadLocalBars('1s').then(function(){
    curData.forEach(function(x){ oneSecondBars[x.t]=x; });
    if(ENABLE_LIVE) open1sSocket();
  }).catch(function(){ if(ENABLE_LIVE) open1sSocket(); });
  if(ws1s && !ENABLE_LIVE){ws1s.onclose=null;ws1s.close();ws1s=null;}
}
function add1sTrade(ms, p, q, buy){
  var t=Math.floor(ms/1000);
  if(!oneSecondBars[t]){ oneSecondBars[t]={t:t,o:p,h:p,l:p,c:p,v:q,bv:buy?q:0,sv:buy?0:q}; }
  else { var c=oneSecondBars[t]; c.h=Math.max(c.h,p);c.l=Math.min(c.l,p);c.c=p;c.v+=q;if(buy)c.bv+=q;else c.sv+=q; }
  var cut=t-600; Object.keys(oneSecondBars).forEach(function(k){if(+k<cut)delete oneSecondBars[k];});
}
function flush1s(){
  var list=Object.values(oneSecondBars).sort(function(a,b){return a.t-b.t;});
  if(!list.length) return;
  curData=list;
  setSeries(list, '1s');
  showPrice(curData); showStats('1s', curData);
  window.__nceDebug = {tf:'1s', bars:curData.length, nai:curData.slice(-1)[0]&&{buy:curData.slice(-1)[0].naiBuy,sell:curData.slice(-1)[0].naiSell,label:curData.slice(-1)[0].naiLabel}, first:curData[0]&&curData[0].t, last:curData[curData.length-1]&&curData[curData.length-1].t, visible:chart.timeScale().getVisibleLogicalRange()};
}
function open1sSocket(){
  ws1s = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@aggTrade');
  ws1s.onmessage = function(e){
    try {
      var d=JSON.parse(e.data), p=+d.p, q=+d.q, buy=!d.m;
      add1sTrade(+d.T, p, q, buy); flush1s();
    } catch(e2){}
  };
  ws1s.onclose=function(){ if(curTF==='1s') setTimeout(open1sSocket,3000); };
}

// === GLOBAL WEBSOCKET (price only, opt-in) ===
var wsPrice = null;
if(ENABLE_LIVE){
  try{
    wsPrice = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
    wsPrice.onmessage = function(e){
      try{ var p=+JSON.parse(e.data).p; document.getElementById('pr').textContent='$'+p.toLocaleString(); } catch(e2){}
    };
    wsPrice.onclose = function(){ if(ENABLE_LIVE) setTimeout(function(){wsPrice=new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');},3000); };
  } catch(e){}
}

window.onresize = function(){chart.applyOptions({width:window.innerWidth,height:window.innerHeight-54});};
updBar();
init();
loadTF('1D');
setInterval(function(){ if(curTF!=='1s') showStats(curTF, curData); }, 60000);
</script>
</body>
</html>
