    html+=card('Data warning',esc([].concat(l.warnings||[],m.warnings||[],d.warnings||[]).join(' | ')),'backend-warn');
  } else if(name==='Options'){

    html+=card('Missing true options feed',esc((j.missing_external_data||[]).join(', ')||'No missing fields reported'),'backend-warn');
    html+=card('Truth',esc('Real options chain is NOT configured yet; this tab now shows real available derivatives proxy data instead of fake skeleton.'),'backend-warn');

    if(j.status!=='PASS'){

    } else {
      html+=card('Calibrated probability','Up: <b>'+fmtNum(prob.up,2)+'%</b><br>Range: <b>'+fmtNum(prob.range,2)+'%</b><br>Down: <b>'+fmtNum(prob.down,2)+'%</b><br>Prediction: <b>'+esc(j.prediction||'UNKNOWN')+'</b>');
      html+=card('Walk-forward validation','Samples: <b>'+esc(j.sample_size||0)+'</b><br>Accuracy: <b>'+fmtNum(met.accuracy_pct,2)+'%</b><br>Brier: <b>'+fmtNum(met.brier_score,6)+'</b><br>Log loss: <b>'+fmtNum(met.log_loss,6)+'</b>');
      html+=card('No-lookahead proof','Closed bars only: <b>'+esc(!!proof.closed_bars_only)+'</b><br>All validation rows pass: <b>'+esc(!!proof.all_validation_rows_pass)+'</b><br>Past-only band: <b>'+esc(!!proof.range_band_uses_only_past_closed_outcomes)+'</b><br>Future rows used: <b>'+esc(!!proof.future_rows_used_for_current_prediction)+'</b>', proof.all_validation_rows_pass&&proof.range_band_uses_only_past_closed_outcomes&&!proof.future_rows_used_for_current_prediction?'backend-ok':'backend-bad');

    html+=card('Rules',listObj(Object.assign({score_is_probability:false},rules)),'backend-warn');
  } else if(name==='Long/Short Skoru'){
    html+=card('Evidence score only',listObj(j.scores||j.score||j),'backend-warn');
    html+=card('Probability guard',esc('These Long/Short values are NOT calibrated probabilities. Use Olasılık Haritası for walk-forward calibrated probability.'),'backend-warn');
  } else if(name==='Simülasyon'){
    html+=card('Current price','$'+fmtNum(j.current_price,2));
    html+=card('Scenarios',Object.keys(j.scenarios||{}).map(function(k){var x=j.scenarios[k];return '<b>'+esc(k)+':</b> '+fmtNum(x.net_return_pct,6)+'% net → $'+fmtNum(x.projected_price,2);}).join('<br>')||'No scenario');

    html+=card('Assumptions',listObj(j.assumptions||{}),'backend-warn');
  } else if(name==='Volume/Market Profile'){
    var vp=j.volume_profile||{}; html+=card('Volume profile',listObj((vp.profile&&vp.profile.poc)||vp.profile||{})); html+=card('VWAP',listObj((j.vwap&&j.vwap.vwap)||j.vwap||{})); html+=card('Sessions',listObj((j.sessions&&j.sessions.current_session)||j.sessions||{}));
  } else {
    html+=kv(name,j);
  }
  html+=rawDetails(j)+'</div>'; return html;
}

function closedBars(list){return (list||[]).filter(function(x){return x&&x.closed!==false&&isFinite(x.c)&&isFinite(x.h)&&isFinite(x.l);});}
function computeVWAP(list){var pv=0,v=0,out=[];list.forEach(function(x){var vol=Math.max(1,+(x.v||0)),typ=(x.h+x.l+x.c)/3;pv+=typ*vol;v+=vol;out.push({time:x.t,value:pv/v});});return out;}
function computeBB(list,len,mult){var outU=[],outM=[],outL=[];for(var i=0;i<list.length;i++){if(i+1<len)continue;var w=list.slice(i+1-len,i+1).map(function(x){return x.c;}),mean=w.reduce(function(a,b){return a+b;},0)/len,sd=Math.sqrt(w.reduce(function(a,b){return a+Math.pow(b-mean,2);},0)/len);outM.push({time:list[i].t,value:mean});outU.push({time:list[i].t,value:mean+mult*sd});outL.push({time:list[i].t,value:mean-mult*sd});}return {upper:outU,mid:outM,lower:outL};}
function computeProfile(list,bins){var lo=Math.min.apply(null,list.map(function(x){return x.l;})),hi=Math.max.apply(null,list.map(function(x){return x.h;})),step=(hi-lo)/(bins||48)||1,arr=[];for(var i=0;i<(bins||48);i++)arr.push({price:lo+step*(i+.5),vol:0});list.forEach(function(x){var idx=Math.max(0,Math.min(arr.length-1,Math.floor(((x.h+x.l+x.c)/3-lo)/step)));arr[idx].vol+=+(x.v||0);});var sorted=arr.slice().sort(function(a,b){return b.vol-a.vol;}),poc=sorted[0]||{price:0,vol:0};var pocIndex=arr.findIndex(function(x){return x===poc;}),total=arr.reduce(function(a,b){return a+b.vol;},0),take=poc.vol,left=pocIndex-1,right=pocIndex+1,low=poc.price,high=poc.price;while(take<total*.70&&(left>=0||right<arr.length)){var lv=left>=0?arr[left].vol:-1,rv=right<arr.length?arr[right].vol:-1;if(rv>=lv){take+=Math.max(0,rv);high=arr[right].price;right++;}else{take+=Math.max(0,lv);low=arr[left].price;left--;}}return {poc:poc.price,hvn:sorted.slice(0,3).map(function(x){return x.price;}),lvn:arr.filter(function(x){return x.vol>0}).sort(function(a,b){return a.vol-b.vol;}).slice(0,3).map(function(x){return x.price;}),vah:high,val:low,total:total,bins:arr.length};}

function rma(prev,val,len){return prev==null?val:(((prev*(len-1))+val)/len);}

function syncInstantPrice(){return marketGet('/api/v1/market/bookticker?symbol=BTCUSDT',BIN+BIN_PATH+'/ticker/bookTicker?symbol=BTCUSDT').then(function(j){var bid=+(j.bidPrice||j.bid),ask=+(j.askPrice||j.ask),mid=+(j.mid||((bid+ask)/2));if(isFinite(mid)&&mid>0){updateHeaderPrice(mid,headerPrice!=null?headerPrice:mid);archiveCollector('binance_bookticker_price','bookTicker',[{t:Math.floor(Date.now()/1000),bid:bid,ask:ask,mid:mid,source:j.source||'binance_direct'}]);}return j;}).catch(function(e){console.warn('instant price fallback',e&&e.message||e);return null;});}

function updateHeaderPrice(price,prev){if(!isFinite(price)||price<=0)return;headerPrevPrice=(prev!=null&&isFinite(prev)&&prev>0)?prev:(headerPrice!=null?headerPrice:price);headerPrice=price;headerPriceTs=Date.now();var ch=(price-headerPrevPrice)/(headerPrevPrice||price)*100;document.getElementById('pr').textContent='$'+price.toLocaleString();document.getElementById('cg').textContent=(ch>0?'+':'')+ch.toFixed(2)+'%';document.getElementById('cg').className=ch>=0?'gn':'rd';}

function onCrosshair(p){if(!p.time||!p.point||!curData.length){tip.style.display='none';return;}var d=p.seriesData.get(cs);if(!d){tip.style.display='none';return;}var m=curData.find(function(x){return x.t===d.time;})||{},dt=new Date(d.time*1000),state=m.closed?'CLOSED':'PROVISIONAL';var ev=m.closed?(m.naiLabel||'-'):('PROVISIONAL: '+((m.naiProvisionalEvents||[]).join(', ')||'-'));var h='<b style="color:#e94560;font-size:9px">'+dt.toISOString().slice(0,16).replace('T',' ')+' UTC</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:1px 5px;font-size:8px">';h+='Market:<span>'+MARKET+'</span>Unit:<span>'+VOLUME_UNIT+'</span>State:<span class="'+(m.closed?'':'prov')+'">'+state+'</span>TF EMA5:<span>'+tfText(curTF)+'</span>';h+='O:<span>$'+d.open.toFixed(1)+'</span>H:<span style="color:#3fb950">$'+d.high.toFixed(1)+'</span>L:<span style="color:#f85149">$'+d.low.toFixed(1)+'</span>C:<span>$'+d.close.toFixed(1)+'</span>';h+='BuyLine:<span style="color:#3fb950">'+((m.naiBuy||0).toFixed(2))+'</span>SellLine:<span style="color:#f85149">'+((m.naiSell||0).toFixed(2))+'</span>';h+='ND:<span>'+((m.naiND||0).toFixed(4))+'</span>VolPower:<span>'+((m.naiVP||0).toFixed(3))+'</span>ATR14:<span>'+((m.naiATR14||0).toFixed(3))+'</span>PriceResp:<span>'+((m.naiPriceResponse||0).toFixed(3))+'</span>';h+='Events:<span style="color:#f2cc60">'+ev+'</span></div>';tip.innerHTML=h;tip.style.cssText='display:block;position:absolute;left:'+Math.max(5,Math.min(p.point.x,window.innerWidth-250))+'px;top:'+Math.max(5,p.point.y-10)+'px';}
function resizeC(){var vh=pan.vol?0.22:0,dh=pan.del?0.12:0,nh=pan.nai?0.14:0,used=vh+dh+nh;chart.priceScale('right').applyOptions({scaleMargins:{top:0,bottom:used}});chart.priceScale('vol').applyOptions({scaleMargins:{top:1-used,bottom:dh+nh}});chart.priceScale('del').applyOptions({scaleMargins:{top:1-dh-nh,bottom:nh}});chart.priceScale('nai').applyOptions({scaleMargins:{top:1-nh,bottom:0.01},visible:pan.nai});}
